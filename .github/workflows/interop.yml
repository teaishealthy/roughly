name: Interop (Plummet)

permissions:
    pull-requests: write

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    interop:
        runs-on: ubuntu-latest

        steps:
            - parallel:
                - name: Checkout roughly
                  uses: actions/checkout@v4
                  with:
                      path: roughly-src

                - name: Checkout Plummet and submodules
                  uses: actions/checkout@v4
                  with:
                      repository: ietf-wg-ntp/Roughtime-interop-code
                      path: plummet
                      submodules: recursive

            - name: Substitute current checkout into the roughly implementation
              run: |
                  mkdir -p plummet/implementations/roughly/roughly
                  rsync -a --delete --exclude='.git' roughly-src/ plummet/implementations/roughly/roughly/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # `docker buildx bake` needs these to talk to the GitHub Actions cache
            # backend (type=gha). docker/build-push-action sets them up internally;
            # calling bake directly requires exposing them ourselves.
            - name: Expose GitHub Actions runtime for buildx cache
              uses: crazy-max/ghaction-github-runtime@v3

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Poetry
              uses: snok/install-poetry@v1

            - name: Cache Poetry dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/pypoetry
                      plummet/.venv
                  key: poetry-${{ runner.os }}-${{ hashFiles('plummet/poetry.lock') }}
                  restore-keys: |
                      poetry-${{ runner.os }}-

            - parallel:
                - name: Install Plummet dependencies
                  working-directory: plummet
                  run: poetry install

                # buildx bake ignores the compose file's top-level `name: "plummet"` field
                # (unlike `docker compose build`), so images must be tagged explicitly to
                # match what Plummet's runtime compose file expects: plummet-<service>:latest.
                - name: Build all images
                  working-directory: plummet/implementations
                  shell: bash
                  run: |
                      targets=$(docker buildx bake -f docker-compose.yml --print | jq -r '.target | keys[]')
                      tag_args=()
                      while IFS= read -r target; do
                          tag_args+=(--set "${target}.tags=plummet-${target}:latest")
                      done <<< "$targets"

                      docker buildx bake -f docker-compose.yml \
                          --set "*.cache-from=type=gha" \
                          --set "*.cache-to=type=gha,mode=max" \
                          "${tag_args[@]}" \
                          --load

            - name: Run Plummet
              working-directory: plummet
              run: poetry run plummet --container docker --workers 4 --timeout 15 --focus roughly

            - name: Summarize results
              if: always()
              working-directory: plummet
              run: |
                  poetry run python - <<'PY'
                  import glob
                  import json
                  import os

                  result_files = sorted(glob.glob("results/*/result.json"))
                  if not result_files:
                      print("No results/*/result.json found; Plummet may not have completed.")
                      raise SystemExit(0)

                  with open(result_files[-1]) as f:
                      results = json.load(f)

                  concerning = [
                      r for r in results
                      if (r["client"] == "roughly" or r["server"] == "roughly")
                      and r["result"] in ("failure", "error")
                  ]

                  summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
                  lines = ["## Plummet interop results involving roughly", ""]
                  if not concerning:
                      lines.append("No failures or errors involving `roughly`. :white_check_mark:")
                  else:
                      lines.append("| Server | Client | Result |")
                      lines.append("|---|---|---|")
                      for r in concerning:
                          lines.append(f"| {r['server']} | {r['client']} | {r['result']} |")

                  text = "\n".join(lines) + "\n"
                  print(text)
                  if summary_path:
                      with open(summary_path, "a") as f:
                          f.write(text)
                  with open("pr_comment.md", "w") as f:
                      f.write(text)
                  PY

            - name: Comment on PR
              if: ${{ github.event_name == 'pull_request' }}
              uses: marocchino/sticky-pull-request-comment@v3
              with:
                  header: plummet-interop-results
                  path: plummet/pr_comment.md

            - name: Upload results artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: plummet-results-${{ github.run_id }}
                  path: plummet/results/
                  if-no-files-found: ignore
